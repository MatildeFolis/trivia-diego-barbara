<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>¿Cuánto nos conocés? — Diego y Bárbara</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Quicksand:wght@300;400;500;600&display=swap');
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;background:#ffffff;display:flex;align-items:center;justify-content:center;font-family:'Quicksand',sans-serif;padding:20px}
.card{background:#fff;max-width:420px;width:100%;overflow:hidden;box-shadow:0 2px 40px rgba(0,0,0,0.07);border:1px solid #dde8db}
.hdr{background:#fff;padding:48px 32px 36px;text-align:center;border-bottom:1px solid #dde8db}
.hdr::after{content:'';display:block;width:40px;height:1.5px;background:#7d9b76;margin:20px auto 0}
.nom{font-family:'Playfair Display',serif;font-size:38px;font-weight:400;color:#7d9b76;letter-spacing:2px;line-height:1.2}
.subtit{font-family:'Quicksand',sans-serif;font-size:11px;font-weight:500;color:#7d9b76;letter-spacing:5px;text-transform:uppercase;margin-bottom:10px;opacity:0.7}
.tagline{font-family:'Playfair Display',serif;font-style:italic;font-size:15px;color:#aaa;margin-top:20px;line-height:1.6}
.body{padding:32px}
.cta{background:#7d9b76;color:#fff;border:none;width:100%;padding:16px;font-family:'Quicksand',sans-serif;font-size:11px;font-weight:600;letter-spacing:4px;text-transform:uppercase;cursor:pointer}
.cta2{background:transparent;color:#7d9b76;border:1px solid #7d9b76;width:100%;padding:14px;font-family:'Quicksand',sans-serif;font-size:10px;font-weight:600;letter-spacing:3px;text-transform:uppercase;cursor:pointer;margin-top:12px}
.thdr{background:#7d9b76;padding:24px 32px;display:flex;align-items:center;justify-content:space-between}
.ttit{font-family:'Playfair Display',serif;font-size:20px;color:#fff;font-weight:400}
.tnum{font-family:'Quicksand',sans-serif;font-size:10px;color:rgba(255,255,255,0.7);letter-spacing:2px}
.pbar{height:2px;background:#dde8db}
.pfill{height:2px;background:#7d9b76;transition:width 0.4s}
.pbody{padding:32px}
.ptxt{font-family:'Playfair Display',serif;font-size:22px;color:#7d9b76;line-height:1.5;margin-bottom:24px}
.obtn{display:block;width:100%;text-align:left;padding:14px 18px;border:1px solid #dde8db;background:#fff;font-family:'Quicksand',sans-serif;font-size:14px;font-weight:500;color:#333;cursor:pointer;margin-bottom:10px}
.obtn:hover{border-color:#7d9b76;background:#f5f8f4}
.ok{border-color:#7d9b76!important;background:#f0f5ef!important;color:#7d9b76!important}
.no{border-color:#c62828!important;background:#fdf1f1!important;color:#c62828!important}
.sig{background:#7d9b76;color:#fff;border:none;width:100%;padding:15px;font-family:'Quicksand',sans-serif;font-size:10px;font-weight:600;letter-spacing:4px;text-transform:uppercase;cursor:pointer;margin-top:6px}
.rhdr{background:#7d9b76;padding:40px 32px;text-align:center}
.rnum{font-family:'Playfair Display',serif;font-size:72px;font-weight:400;color:#fff;line-height:1}
.rsub{font-family:'Quicksand',sans-serif;font-size:11px;letter-spacing:4px;color:rgba(255,255,255,0.7);text-transform:uppercase;margin-top:6px}
.rbody{padding:32px;text-align:center}
.rmsg{font-family:'Playfair Display',serif;font-size:26px;color:#7d9b76;margin-bottom:10px}
.rsub2{font-family:'Quicksand',sans-serif;font-size:13px;color:#888;line-height:1.6;margin-bottom:28px}
.dots{display:flex;justify-content:center;gap:8px;margin-bottom:28px}
.dot{width:10px;height:10px;border-radius:50%}
.screen{display:none}
.screen.active{display:block}
</style>
</head>
<body>
<div class="card">

  <div class="screen active" id="s-inv">
    <div class="hdr">
      <div class="subtit">Matrimonio</div>
      <div class="nom">Diego y Bárbara</div>
      <p class="tagline">¿Cuánto nos conoces?<br>Pone a prueba lo que sabes de nosotros.</p>
    </div>
    <div class="body">
      <button class="cta" onclick="iniciarTrivia()">¡Juguemos!</button>
    </div>
  </div>

  <div class="screen" id="s-trivia">
    <div class="thdr">
      <span class="ttit">¿Cuánto nos conoces?</span>
      <span class="tnum" id="progNum">1 / 5</span>
    </div>
    <div class="pbar"><div class="pfill" id="pfill" style="width:0%"></div></div>
    <div class="pbody">
      <p class="ptxt" id="pregTxt"></p>
      <div id="opciones"></div>
      <button class="sig" id="btnSig" style="display:none" onclick="siguiente()">Siguiente</button>
    </div>
  </div>

  <div class="screen" id="s-res">
    <div class="rhdr">
      <div class="rnum" id="rPuntaje"></div>
      <div class="rsub">de 5 correctas</div>
    </div>
    <div class="rbody">
      <div class="dots" id="rDots"></div>
      <p class="rmsg" id="rMsg"></p>
      <p class="rsub2" id="rSub"></p>
      <button class="cta" onclick="window.location.href='https://invitarteonline.com.ar/diego-barbara'">Volver a la invitación</button>
      <button class="cta2" onclick="reiniciar()">Jugar de nuevo</button>
    </div>
  </div>

</div>

<script>
const preguntas = [
  { p: "¿Dónde nos conocimos?", ops: ["En Buenos Aires","En Algarrobo","En Santiago","Por redes sociales"], c: 1 },
  { p: "¿Cuánto tiempo llevamos juntos?", ops: ["1 año","2 años","Más de 3 años","5 años"], c: 2 },
  { p: "¿Cuál es nuestra comida favorita?", ops: ["Empanadas","Asado","Cazuela","Tablas de picoteo"], c: 3 },
  { p: "¿Cuál es nuestro lugar favorito en el mundo?", ops: ["La playa","Buenos Aires","Bariloche","Nuestro hogar"], c: 3 },
  { p: "¿A qué artista escuchamos juntos?", ops: ["Coldplay","Mon Laferte","Bad Bunny","Miranda"], c: 3 },
];

let paso=0,puntaje=0,respondida=false,respuestas=[];

function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  window.scrollTo(0,0);
}

function iniciarTrivia(){
  paso=0;puntaje=0;respondida=false;respuestas=[];
  renderPregunta();
  show('s-trivia');
}

function renderPregunta(){
  const q=preguntas[paso];
  document.getElementById('pregTxt').textContent=q.p;
  document.getElementById('progNum').textContent=`${paso+1} / ${preguntas.length}`;
  document.getElementById('pfill').style.width=`${(paso/preguntas.length)*100}%`;
  document.getElementById('btnSig').style.display='none';
  respondida=false;
  const cont=document.getElementById('opciones');
  cont.innerHTML='';
  q.ops.forEach((op,i)=>{
    const btn=document.createElement('button');
    btn.className='obtn';
    btn.textContent=op;
    btn.onclick=()=>elegir(i,btn);
    cont.appendChild(btn);
  });
}

function elegir(idx,btn){
  if(respondida)return;
  respondida=true;
  const q=preguntas[paso];
  const correcta=idx===q.c;
  if(correcta)puntaje++;
  respuestas.push(correcta);
  document.querySelectorAll('.obtn').forEach((b,i)=>{
    b.disabled=true;
    if(i===q.c)b.classList.add('ok');
    else if(i===idx&&!correcta)b.classList.add('no');
  });
  const sig=document.getElementById('btnSig');
  sig.textContent=paso<preguntas.length-1?'Siguiente':'Ver resultado';
  sig.style.display='block';
  document.getElementById('pfill').style.width=`${((paso+1)/preguntas.length)*100}%`;
}

function siguiente(){
  if(paso<preguntas.length-1){paso++;renderPregunta();}
  else{mostrarResultado();}
}

function mostrarResultado(){
  document.getElementById('rPuntaje').textContent=puntaje;
  const dots=document.getElementById('rDots');
  dots.innerHTML=respuestas.map(r=>`<div class="dot" style="background:${r?'#7d9b76':'#c62828'}"></div>`).join('');
  let msg,sub;
  if(puntaje===5){msg='¡Los conocés de memoria! 🌿';sub='Sos su persona favorita en la fiesta.';}
  else if(puntaje>=3){msg='¡Bastante bien! ✨';sub='Ya casi, pero hay secretos que solo ellos saben...';}
  else{msg='¡Hay que ponerse al día! 🫶';sub='Más razones para festejar juntos.';}
  document.getElementById('rMsg').textContent=msg;
  document.getElementById('rSub').textContent=sub;
  show('s-res');
}

function reiniciar(){iniciarTrivia();}
</script>
</body>
</html>
